<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>XCron CV</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f5fc">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!--
    The boot splash is inlined so a spinner is visible on the very first paint, before the
    Angular bundle (and styles.scss) finishes loading. This is what a user sees while the
    X Cron handoff redirects to CV, especially inside the Jobs app's in-app WebView.
  -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(247, 245, 252, 0.92);
      color: #1a1430;
      font: 700 1.15rem/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif;
      letter-spacing: 0.02em;
      transition: opacity 0.2s ease;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    #boot-splash .boot-splash__mark {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(109, 79, 240, 0.28);
    }
    #boot-splash .boot-splash__spin {
      box-sizing: border-box;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(124, 92, 255, 0.22);
      border-top-color: #7c5cff;
      border-right-color: #f5a524;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    #boot-splash.done { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      #boot-splash { background: rgba(7, 4, 18, 0.92); color: #ffffff; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .boot-splash__spin { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div id="boot-splash" aria-hidden="true">
    <svg class="boot-splash__mark" viewBox="0 0 108 108" role="img" aria-label="XCron CV">
      <defs>
        <linearGradient id="boot-brand" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7c5cff"></stop>
          <stop offset="1" stop-color="#f5a524"></stop>
        </linearGradient>
      </defs>
      <rect width="108" height="108" rx="24" fill="url(#boot-brand)"></rect>
      <path d="M34 34L74 74M74 34L34 74" fill="none" stroke="#1a1208" stroke-width="15" stroke-linecap="round"></path>
    </svg>
    <span class="boot-splash__spin"></span>
    <span>XCron CV</span>
  </div>
  <app-root></app-root>
</body>
</html>
